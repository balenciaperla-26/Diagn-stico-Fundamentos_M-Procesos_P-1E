<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico - Fundamentos Matemáticos</title>
<style>
:root{--naranja:#FF8201;--teal:#49C2B3;--bg:#1B1E22;--bg-card:#24282E;--bg-card-2:#2D3239;--borde:#3A3F47;--texto:#EDEEF0;--texto-tenue:#A7ADB6;--verde:#3FB56F;--rojo:#E15554;--amarillo:#F0A93F;--radio:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--texto);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;}
.contenedor{width:100%;max-width:720px;}
.tarjeta{background:var(--bg-card);border:1px solid var(--borde);border-radius:var(--radio);padding:24px;margin-bottom:16px;box-shadow:0 4px 24px rgba(0,0,0,0.25);}
.logo{text-align:center;font-size:2rem;font-weight:900;color:var(--naranja);letter-spacing:2px;margin-bottom:4px;}
h1{text-align:center;font-size:1.3rem;color:var(--texto);font-weight:700;}
h2.subtitulo{text-align:center;font-size:0.95rem;font-weight:500;color:var(--naranja);margin:4px 0;}
p.institucion{text-align:center;color:var(--texto-tenue);font-size:0.8rem;margin:0 0 16px;}
.aviso-local{background:rgba(240,169,63,0.12);border:1px solid var(--amarillo);color:var(--amarillo);border-radius:10px;padding:10px 14px;font-size:0.85rem;margin-bottom:16px;}
ol.instrucciones{padding-left:20px;color:var(--texto);font-size:0.9rem;line-height:1.6;}
ol.instrucciones li{margin-bottom:4px;}
label{display:block;font-size:0.8rem;color:var(--texto-tenue);margin:14px 0 4px;font-weight:600;}
input[type=text],input[type=password]{width:100%;background:var(--bg-card-2);border:1px solid var(--borde);border-radius:8px;padding:12px 14px;color:var(--texto);font-size:16px;outline:none;}
input[type=text]:focus,input[type=password]:focus{border-color:var(--naranja);}
input[readonly]{color:var(--texto-tenue);background:#20242a;}
.btn{display:inline-block;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .08s,opacity .15s;font-family:inherit;}
.btn:active{transform:scale(0.97);}
.btn-primario{background:var(--naranja);color:#1B1E22;}
.btn-primario:hover{background:#D96D00;}
.btn-secundario{background:transparent;color:var(--teal);border:1.5px solid var(--teal);}
.btn-secundario:hover{background:rgba(73,194,179,0.1);}
.btn-peligro{background:transparent;color:var(--rojo);border:1.5px solid var(--rojo);}
.btn-peligro:hover{background:rgba(225,85,84,0.12);}
.btn-bloque{width:100%;text-align:center;margin-top:16px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.fila-botones{display:flex;gap:10px;margin-top:16px;}
.fila-botones .btn{flex:1;min-width:0;}
.barra-progreso{height:6px;background:var(--bg-card-2);border-radius:4px;overflow:hidden;margin-bottom:4px;}
.barra-progreso-fill{height:100%;background:linear-gradient(90deg,var(--naranja),var(--teal));transition:width .25s;}
.progreso-texto{font-size:0.75rem;color:var(--texto-tenue);text-align:right;margin-bottom:16px;}
.etiqueta-tema{display:inline-block;background:rgba(73,194,179,0.15);color:var(--teal);font-size:0.7rem;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;padding:3px 10px;border-radius:16px;margin-bottom:10px;}
.pregunta-texto{font-size:1.05rem;line-height:1.5;margin-bottom:16px;font-weight:600;}
.opcion{display:block;width:100%;text-align:left;background:var(--bg-card-2);border:1.5px solid var(--borde);border-radius:8px;padding:12px 14px;color:var(--texto);font-size:0.92rem;margin-bottom:8px;cursor:pointer;font-family:inherit;transition:border-color .12s,background .12s;}
.opcion:hover{border-color:var(--naranja);}
.opcion.seleccionada{border-color:var(--naranja);background:rgba(255,130,1,0.12);}
.opcion-noidentifico{margin-top:12px;border-color:var(--borde);color:var(--texto-tenue);font-style:italic;}
.opcion-noidentifico.seleccionada{border-color:var(--amarillo);background:rgba(240,169,63,0.1);color:var(--amarillo);}
.resumen-puntaje{text-align:center;margin-bottom:6px;}
.resumen-puntaje .numero{font-size:2.5rem;font-weight:800;color:var(--naranja);line-height:1;}
.resumen-puntaje .de-total{color:var(--texto-tenue);font-size:0.9rem;}
.nivel-badge{display:inline-block;padding:4px 14px;border-radius:16px;font-weight:700;font-size:0.8rem;margin:6px auto 0;text-align:center;}
.nivel-alto{background:rgba(63,181,111,0.18);color:var(--verde);}
.nivel-medio{background:rgba(240,169,63,0.18);color:var(--amarillo);}
.nivel-bajo{background:rgba(225,85,84,0.18);color:var(--rojo);}
.centrado{text-align:center;}
.stats-grid{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
.stat-box{flex:1;min-width:100px;background:var(--bg-card-2);border-radius:8px;padding:12px;text-align:center;}
.stat-box .valor{font-size:1.2rem;font-weight:700;color:var(--texto);}
.stat-box .etiqueta{font-size:0.7rem;color:var(--texto-tenue);margin-top:2px;}
.frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;margin:0 2px;line-height:1.05;font-size:0.94em;position:relative;top:0.05em;}
.frac-num{padding:0 3px 1px;border-bottom:1.4px solid currentColor;}
.frac-den{padding:1px 3px 0;}
.recomendacion-texto{color:var(--texto);font-size:0.85rem;line-height:1.5;margin:0 0 12px;}
.tema-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:8px;background:var(--bg-card-2);margin-bottom:8px;border-left:4px solid var(--borde);}
.tema-item.tema-alto{border-left-color:var(--verde);}
.tema-item.tema-medio{border-left-color:var(--amarillo);}
.tema-item.tema-bajo{border-left-color:var(--rojo);}
.tema-nombre{font-size:0.85rem;font-weight:600;color:var(--texto);}
.tema-puntaje{font-size:0.7rem;color:var(--texto-tenue);margin-top:2px;}
.tema-badge{font-size:0.65rem;font-weight:700;padding:3px 10px;border-radius:14px;white-space:nowrap;text-transform:uppercase;letter-spacing:0.02em;}
.tema-badge.nivel-alto{background:rgba(63,181,111,0.18);color:var(--verde);}
.tema-badge.nivel-medio{background:rgba(240,169,63,0.18);color:var(--amarillo);}
.tema-badge.nivel-bajo{background:rgba(225,85,84,0.18);color:var(--rojo);}
.revision-item{border:1px solid var(--borde);border-radius:8px;padding:10px 14px;margin-bottom:8px;border-left:4px solid var(--borde);}
.revision-correcta{border-left-color:var(--verde);}
.revision-incorrecta{border-left-color:var(--rojo);}
.revision-noidentifico{border-left-color:var(--amarillo);}
.revision-pregunta{font-weight:600;font-size:0.85rem;margin-bottom:4px;}
.revision-detalle{font-size:0.8rem;color:var(--texto-tenue);line-height:1.4;}
.revision-detalle b.ok{color:var(--verde);}
.revision-detalle b.mal{color:var(--rojo);}
.pill-estado{display:inline-block;font-size:0.6rem;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:8px;margin-left:6px;letter-spacing:0.03em;}
.pill-correcta{background:rgba(63,181,111,0.18);color:var(--verde);}
.pill-incorrecta{background:rgba(225,85,84,0.18);color:var(--rojo);}
.pill-noidentifico{background:rgba(240,169,63,0.18);color:var(--amarillo);}
.enlace-tenue{color:var(--teal);font-size:0.8rem;text-decoration:none;cursor:pointer;}
.enlace-tenue:hover{text-decoration:underline;}
.spinner{width:30px;height:30px;border:3px solid var(--bg-card-2);border-top-color:var(--naranja);border-radius:50%;animation:girar 0.8s linear infinite;margin:16px auto;}
@keyframes girar{to{transform:rotate(360deg);}}
.mensaje-error{background:rgba(225,85,84,0.12);border:1px solid var(--rojo);color:var(--rojo);border-radius:8px;padding:12px 14px;font-size:0.85rem;margin:12px 0;}
.mensaje-ok{background:rgba(63,181,111,0.12);border:1px solid var(--verde);color:var(--verde);border-radius:8px;padding:12px 14px;font-size:0.85rem;margin:12px 0;}
.aviso-seleccion{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:2px solid var(--naranja);border-radius:var(--radio);padding:12px 20px;color:var(--texto);font-size:0.9rem;z-index:10000;box-shadow:0 4px 24px rgba(0,0,0,0.6);max-width:90%;text-align:center;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;}
.aviso-cambio-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.aviso-cambio-caja{background:var(--bg-card);border:2px solid var(--rojo);border-radius:14px;padding:20px 24px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.45);}
.aviso-cambio-titulo{color:var(--rojo);font-weight:800;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;}
.aviso-cambio-mensaje{color:var(--texto);font-size:0.85rem;line-height:1.5;margin-bottom:14px;}
.aviso-cambios-resultado{background:var(--bg-card-2);border:1.5px solid var(--rojo);border-radius:8px;padding:10px 14px;font-size:0.8rem;line-height:1.4;color:var(--texto);margin:12px 0;text-align:center;}
.comparacion-barra-wrap{margin-top:8px;}
.comparacion-fila{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.comparacion-fila .nombre{width:70px;font-size:0.75rem;color:var(--texto-tenue);flex-shrink:0;}
.comparacion-track{flex:1;height:12px;background:var(--bg-card-2);border-radius:6px;overflow:hidden;}
.comparacion-fill{height:100%;border-radius:6px;}
.comparacion-fill.tu{background:var(--naranja);}
.comparacion-fill.grupo{background:var(--teal);}
.comparacion-valor{width:36px;font-size:0.75rem;text-align:right;color:var(--texto-tenue);}
table.tabla-docente{width:100%;border-collapse:collapse;font-size:0.75rem;margin-top:12px;}
table.tabla-docente th{text-align:left;color:var(--texto-tenue);font-size:0.65rem;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--borde);letter-spacing:0.03em;}
table.tabla-docente td{padding:6px 8px;border-bottom:1px solid var(--borde);}
.tabla-scroll{overflow-x:auto;}
.zona-riesgo{border:1.5px dashed var(--rojo);border-radius:8px;padding:14px;margin-top:20px;}
.zona-riesgo h3{color:var(--rojo);margin:0 0 6px;font-size:0.9rem;}
.zona-riesgo p{color:var(--texto-tenue);font-size:0.78rem;margin:0 0 10px;line-height:1.4;}
@media (max-width:480px){body{padding:12px 8px 30px;}.tarjeta{padding:16px;}.logo{font-size:1.6rem;}h1{font-size:1.1rem;}.pregunta-texto{font-size:0.95rem;}.resumen-puntaje .numero{font-size:2rem;}.stats-grid{gap:6px;}.stat-box{min-width:80px;padding:8px;}input[type=text],input[type=password]{font-size:16px;}.btn{padding:10px 14px;font-size:13px;}}
</style>
</head>
<body>
<div class="contenedor" id="app"></div>
<script>
// ================================================================
// BANCO DE 20 PREGUNTAS - FORMATO COMPACTO
// ================================================================
var P = [
{t:"Fracciones - Simplificación",q:"Simplifica la fracción [[18|24]] a su mínima expresión",o:["[[3|4]]","[[2|3]]","[[4|5]]","[[5|6]]"],c:0,v:[{e:"Simplifica la fracción [[20|30]] a su mínima expresión",r:"[[2|3]]"}]},
{t:"Fracciones - Suma",q:"Calcula: [[2|3]] + [[1|6]]",o:["[[5|6]]","[[3|9]]","[[1|2]]","[[5|9]]"],c:0,v:[{e:"Calcula: [[1|4]] + [[1|2]]",r:"[[3|4]]"}]},
{t:"Fracciones - Multiplicación",q:"Calcula: [[3|4]] · [[2|5]]",o:["[[3|10]]","[[5|9]]","[[2|3]]","[[6|5]]"],c:0,v:[{e:"Calcula: [[2|3]] · [[3|4]]",r:"[[1|2]]"}]},
{t:"Números negativos - Suma",q:"Calcula: 8 + (−3) + (−7)",o:["−2","18","−12","2"],c:0,v:[{e:"Calcula: 9 + (−4) + (−8)",r:"−3"}]},
{t:"Números negativos - Multiplicación",q:"Calcula: (−4)(−2)",o:["8","−8","6","−6"],c:0,v:[{e:"Calcula: (−5)(−3)",r:"15"}]},
{t:"Porcentaje",q:"Calcula el 10% de 240",o:["24","36","15","30"],c:0,v:[{e:"Calcula el 10% de 150",r:"15"}]},
{t:"Jerarquía de operaciones",q:"Calcula: 3 + (4)(2) − [[6|3]]",o:["9","11","5","7"],c:0,v:[{e:"Calcula: 4 + (5)(2) − [[8|4]]",r:"12"}]},
{t:"Jerarquía de operaciones",q:"Calcula: (5 − 2)² + (4)(3)",o:["21","33","15","27"],c:0,v:[{e:"Calcula: (4 − 1)² + (5)(2)",r:"19"}]},
{t:"Mínimo común múltiplo",q:"Calcula el mínimo común múltiplo (m.c.m.) de 6 y 8",o:["24","12","48","2"],c:0,v:[{e:"Calcula el m.c.m. de 4 y 6",r:"12"}]},
{t:"Ley de signos",q:"Calcula: (−5) − (−3)",o:["−2","2","−8","8"],c:0,v:[{e:"Calcula: (−7) − (−2)",r:"−5"}]},
{t:"Lenguaje algebraico - Traducción",q:"¿Qué expresión representa 'el doble de un número aumentado en 5'?",o:["2x + 5","2(x + 5)","x + 5","2x − 5"],c:0,v:[{e:"¿Qué expresión representa 'el triple de un número aumentado en 4'?",r:"3x + 4"}]},
{t:"Lenguaje algebraico - Traducción",q:"¿Qué expresión representa 'el triple de la diferencia de un número y 2'?",o:["3(x − 2)","3x − 2","x − 6","3(2 − x)"],c:0,v:[{e:"¿Qué expresión representa 'el doble de la diferencia de un número y 3'?",r:"2(x − 3)"}]},
{t:"Lenguaje algebraico - Simplificación",q:"Simplifica: 5x + 3x − 2x",o:["6x","8x","4x","6x²"],c:0,v:[{e:"Simplifica: 4x + 6x − 3x",r:"7x"}]},
{t:"Lenguaje algebraico - Simplificación",q:"Simplifica: 3(2x + 4) − 2x",o:["4x + 12","6x + 12","4x + 4","2x + 12"],c:0,v:[{e:"Simplifica: 2(3x + 5) − 4x",r:"2x + 10"}]},
{t:"Lenguaje algebraico - Evaluación",q:"Evalúa: 2x² − 3x + 1 para x = 2",o:["3","7","11","5"],c:0,v:[{e:"Evalúa: 3x² − 2x + 1 para x = 2",r:"9"}]},
{t:"Ecuaciones lineales",q:"Resuelve: 3x + 5 = 20",o:["x = 5","x = 15","x = [[25|3]]","x = 6"],c:0,v:[{e:"Resuelve: 4x + 3 = 19",r:"x = 4"}]},
{t:"Ecuaciones lineales",q:"Resuelve: 2(x − 3) = 10",o:["x = 8","x = 5","x = 13","x = 3.5"],c:0,v:[{e:"Resuelve: 3(x − 2) = 12",r:"x = 6"}]},
{t:"Ecuaciones lineales",q:"Resuelve: [[x|4]] − 2 = 3",o:["x = 20","x = 4","x = 12","x = 5"],c:0,v:[{e:"Resuelve: [[x|3]] − 1 = 4",r:"x = 15"}]},
{t:"Razón y proporción",q:"Si 3 cuadernos cuestan $45, ¿cuánto cuestan 5 cuadernos al mismo precio?",o:["$75","$60","$90","$67.50"],c:0,v:[{e:"Si 2 lápices cuestan $18, ¿cuánto cuestan 5 lápices?",r:"$45"}]},
{t:"Razón y proporción",q:"Si 4 obreros terminan un muro en 6 días, ¿en cuántos días lo terminarán 8 obreros?",o:["3 días","12 días","6 días","4 días"],c:0,v:[{e:"Si 3 pintores pintan una casa en 8 días, ¿en cuántos días la pintarán 6 pintores?",r:"4 días"}]}
];
var TOT = 20;
var CFG = {pin:"UTP2025",grupo:"1° E",carrera:"Procesos Productivos",institucion:"Universidad Tecnológica Santa Catarina",materia:"Fundamentos Matemáticos"};

// ================================================================
// ESTADO
// ================================================================
var E = {pantalla:'inicio',nombre:'',sesion:[],idx:0,respuestas:{},inicio:null,tiempo:0,cambios:0,resultado:null,promedioGrupo:null,totalRespuestasGrupo:0,consultaNombre:'',consultado:null,consultaError:false,autenticado:false,registros:[],mostrandoHistorico:false,puntoCorte:null,confirmandoBorrado:false,mensajeBorrado:null,guardando:false,errorGuardado:false,repasoPendientes:[],repasoOrigen:'resultado',_ignorarCambioPantalla:false};

// ================================================================
// UTILIDADES
// ================================================================
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function fmt(s){var m=Math.floor(s/60);var seg=s%60;return String(m).padStart(2,'0')+':'+String(seg).padStart(2,'0');}
function fTiempo(s){var h=Math.floor(s/3600);var m=Math.floor((s%3600)/60);var seg=s%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(seg).padStart(2,'0');}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function frac(html){return html.replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,function(m,n,d){return '<span class="frac"><span class="frac-num">'+n+'</span><span class="frac-den">'+d+'</span></span>';});}
function txt(t){return frac(esc(t));}
function local(){if(window.location.hostname.includes('github.io')){return false;}return typeof window.storage==='undefined';}

// ================================================================
// ALMACENAMIENTO
// ================================================================
async function guardar(reg){try{var h=JSON.parse(localStorage.getItem('diag_hist')||'[]');h.push(reg);localStorage.setItem('diag_hist',JSON.stringify(h));}catch(e){return false;}if(!local()&&typeof window.storage!=='undefined'){try{var key='resp:'+Date.now()+'_'+Math.random().toString(36).slice(2,9);await window.storage.set(key,JSON.stringify(reg),true);}catch(e){}}return true;}
async function obtener(){try{var localData=JSON.parse(localStorage.getItem('diag_hist')||'[]');if(localData.length>0){return localData;}}catch(e){}if(!local()&&typeof window.storage!=='undefined'){try{var listado=await window.storage.list('resp:',true);var claves=listado&&listado.keys?listado.keys:[];var regs=[];for(var k of claves){try{var r=await window.storage.get(k,true);if(r&&r.value){regs.push({key:k,...JSON.parse(r.value)});}}catch(e){}}if(regs.length>0){return regs;}}catch(e){}}return [];}
function limpiarAlmacenamientoLocal(){if(confirm('⚠️ ¿Estás seguro de que quieres borrar TODOS los datos guardados? Esto no se puede deshacer.')){try{localStorage.removeItem('diag_hist');localStorage.removeItem('puntoCorte');if(!local()&&typeof window.storage!=='undefined'){try{var listado=await window.storage.list('resp:',true);var claves=listado&&listado.keys?listado.keys:[];for(var k of claves){try{await window.storage.delete(k,true);}catch(e){}}try{await window.storage.delete('config:puntoCorte',true);}catch(e){}}catch(e){}}alert('✅ Todos los datos han sido eliminados correctamente.');E.registros=[];E.totalRespuestasGrupo=0;E.promedioGrupo=null;E.puntoCorte=null;cargarPanel();}catch(e){alert('❌ Error al limpiar datos: '+e.message);}}}

// ================================================================
// LÓGICA
// ================================================================
function crearSesion(){return shuffle([...Array(TOT).keys()]).map(function(bi){return {baseIndex:bi,optOrder:shuffle([0,1,2,3])};});}
function calificar(){var c=0,inc=0,no=0;for(var bi=0;bi<TOT;bi++){var r=E.respuestas[bi];if(r==='no_identifico'){no++;}else if(r===P[bi].c){c++;}else{inc++;}}var pct=c/TOT;var nivel=pct>=0.8?'alto':pct>=0.5?'medio':'bajo';var temas={};P.forEach(function(q,bi){if(!temas[q.t]){temas[q.t]={correctas:0,total:0};}temas[q.t].total++;if(E.respuestas[bi]===q.c){temas[q.t].correctas++;}});var arr=Object.keys(temas).map(function(t){var p=temas[t].correctas/temas[t].total;return {topic:t,correctas:temas[t].correctas,total:temas[t].total,porcentaje:p,nivel:p>=0.8?'alto':p>=0.5?'medio':'bajo'};}).sort(function(a,b){return a.porcentaje-b.porcentaje;});var detalle=P.map(function(q,bi){var r=E.respuestas[bi];return {baseIndex:bi,topic:q.t,question:q.q,correctOption:q.o[q.c],resp:r,esCorrecta:r===q.c};});return {puntaje:c,total:TOT,correctas:c,incorrectas:inc,noIdentifico:no,porcentaje:pct,nivel:nivel,detalle:detalle,temas:arr};}
function recomendar(temas){var bajo=temas.filter(function(t){return t.nivel==='bajo';}).map(function(t){return t.topic;});var medio=temas.filter(function(t){return t.nivel==='medio';}).map(function(t){return t.topic;});if(!bajo.length&&!medio.length){return "¡Bien hecho! Dominas la totalidad de los temas evaluados.";}var rec="Te recomiendo ";if(bajo.length){rec+="dar prioridad a "+bajo.join(', ');}if(bajo.length&&medio.length){rec+=", y repasar ";}else if(!bajo.length&&medio.length){rec+="repasar ";}if(medio.length){rec+=medio.join(', ');}rec+=" antes de iniciar el curso.";return rec;}

async function finalizar(){E.tiempo=Math.round((Date.now()-E.inicio)/1000);E.resultado=calificar();E.guardando=true;irA('guardando');var reg={nombre:E.nombre,carrera:CFG.carrera,grupo:CFG.grupo,puntaje:E.resultado.puntaje,total:E.resultado.total,incorrectas:E.resultado.incorrectas,noIdentifico:E.resultado.noIdentifico,tiempoSegundos:E.tiempo,horaInicio:new Date().toISOString(),fecha:new Date().toISOString(),respuestas:E.respuestas,cambiosPantalla:E.cambios};try{await guardar(reg);E.guardando=false;await calcularPromedio();irA('resultado');}catch(e){E.guardando=false;E.errorGuardado=true;irA('error');}}
async function calcularPromedio(){try{var todas=await obtener();var filtrados=todas;if(E.puntoCorte){var corte=new Date(E.puntoCorte);filtrados=todas.filter(function(r){return r.fecha&&new Date(r.fecha)>corte;});}var vistos=new Set();var unicos=filtrados.filter(function(r){if(!r.nombre||r.nombre.trim()===''){return false;}var clave=(r.nombre||'').trim().toLowerCase()+'_'+(r.fecha||'').slice(0,10);if(vistos.has(clave)){return false;}vistos.add(clave);return true;});var validos=unicos.filter(function(r){return typeof r.puntaje==='number';});if(validos.length>0){var suma=validos.reduce(function(a,r){return a+(r.puntaje||0);},0);E.promedioGrupo=suma/validos.length;E.totalRespuestasGrupo=validos.length;}else{E.promedioGrupo=null;E.totalRespuestasGrupo=0;}}catch(e){E.promedioGrupo=null;E.totalRespuestasGrupo=0;}}

function exportarCSV(){var regs=E.registros||[];var headers=['Nombre','Carrera','Grupo','Puntaje','Total','Hora inicio','Tiempo','Cambios','Fecha'];var filas=regs.map(function(r){var f='',h='';if(r.fecha){var d=new Date(r.fecha);f=d.toLocaleDateString('es-MX');}if(r.horaInicio){var d=new Date(r.horaInicio);h=d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});}return [r.nombre||'',r.carrera||CFG.carrera,r.grupo||CFG.grupo,r.puntaje||0,r.total||TOT,h,fTiempo(r.tiempoSegundos||0),r.cambiosPantalla||0,f];});var csv='\uFEFF'+headers.join(',')+'\n'+filas.map(function(f){return f.join(',');}).join('\n');var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='diagnostico_resultados.csv';a.click();}

  if(tarjetas.length>=3){ejerciciosHtml=tarjetas[1].outerHTML;respuestasHtml=tarjetas[2].outerHTML;}else{ejerciciosHtml=contenido.innerHTML;}
  var fecha=new Date().toLocaleDateString('es-MX');var nombre=esc(E.nombre);
  ventana.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Hoja de repaso</title><style>body{font-family:sans-serif;padding:40px;max-width:800px;margin:0 auto;color:#222;background:#fff;}.logo{text-align:center;font-size:2.5rem;font-weight:900;color:#FF8201;}.materia-titulo{text-align:center;font-size:1.5rem;color:#FF8201;margin-top:-4px;margin-bottom:4px;font-weight:700;}.subtitulo{text-align:center;font-size:1rem;color:#49C2B3;font-weight:500;margin-bottom:16px;}.datos{text-align:center;color:#555;font-size:0.9rem;margin-bottom:20px;}h2{color:#49C2B3;border-bottom:2px solid #49C2B3;padding-bottom:6px;margin-top:20px;margin-bottom:16px;}.etiqueta-tema{display:inline-block;background:rgba(73,194,179,0.15);color:#49C2B3;font-size:0.72rem;font-weight:700;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:6px;}.revision-item{margin-bottom:16px;padding:12px 16px;border-left:4px solid #49C2B3;background:#f5f5f5;border-radius:4px;}.revision-pregunta{font-weight:600;font-size:1rem;margin-top:4px;}.frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;margin:0 3px;line-height:1.05;font-size:0.94em;position:relative;top:0.05em;}.frac-num{padding:0 3px 1px;border-bottom:1.4px solid currentColor;}.frac-den{padding:1px 3px 0;}.footer{text-align:center;color:#999;font-size:0.7rem;margin-top:30px;border-top:1px solid #ddd;padding-top:16px;}</style></head><body><div class="logo">UTSC</div><div class="materia-titulo">Fundamentos Matemáticos</div><div class="subtitulo">Hoja de repaso</div><div class="datos">'+nombre+' · Procesos Productivos · 1° E · '+fecha+'</div>'+ejerciciosHtml+respuestasHtml+'<div class="footer">Universidad Tecnológica Santa Catarina · Fundamentos Matemáticos · '+fecha+'</div><script>window.onload=function(){window.print();};<\/script></body></html>');ventana.document.close();
}
function vistaConsultado(){
  if(E.consultaError||!E.consultado){return '<div class="tarjeta"><div class="logo">UTSC</div><div class="mensaje-error">No se encontró resultado.</div><button class="btn btn-primario btn-bloque" onclick="irA(\'consultar\')">Intentar de nuevo</button></div>';}
  var reg=E.consultado;var pct=Math.round((reg.puntaje/reg.total)*100);var nivel=pct>=80?'alto':pct>=50?'medio':'bajo';var nTxt={alto:'Nivel alto',medio:'Nivel medio',bajo:'Nivel bajo – requiere refuerzo'}[nivel];var nCls={alto:'nivel-alto',medio:'nivel-medio',bajo:'nivel-bajo'}[nivel];var fecha=new Date(reg.fecha);var respGuardadas=reg.respuestas||{};var temas={};P.forEach(function(q,bi){if(!temas[q.t]){temas[q.t]={correctas:0,total:0};}temas[q.t].total++;if(respGuardadas[bi]===q.c){temas[q.t].correctas++;}});var arr=Object.keys(temas).map(function(t){var p=temas[t].correctas/temas[t].total;return {topic:t,correctas:temas[t].correctas,total:temas[t].total,porcentaje:p,nivel:p>=0.8?'alto':p>=0.5?'medio':'bajo'};}).sort(function(a,b){return a.porcentaje-b.porcentaje;});var temasHtml=arr.map(function(t){return '<div class="tema-item tema-'+t.nivel+'"><div><div class="tema-nombre">'+esc(t.topic)+'</div><div class="tema-puntaje">'+t.correctas+' de '+t.total+' correctas</div></div><span class="tema-badge nivel-'+t.nivel+'">'+(t.nivel==='alto'?'Dominado':t.nivel==='medio'?'Repasar':'Requiere refuerzo')+'</span></div>';}).join('');
  return '<div class="tarjeta"><div class="logo">UTSC</div><h1>Fundamentos Matemáticos</h1><h2 class="subtitulo">Diagnóstico</h2><p class="institucion">Universidad Tecnológica Santa Catarina</p><div class="centrado" style="color:var(--texto-tenue);font-size:0.85rem;">'+esc(reg.nombre)+' · '+esc(reg.carrera||'Procesos Productivos')+' · '+esc(reg.grupo||'1° E')+'</div><div class="resumen-puntaje"><div class="numero">'+reg.puntaje+' <span style="color:var(--texto-tenue);font-size:0.9rem;">/ '+reg.total+'</span></div><div class="nivel-badge '+nCls+'">'+nTxt+'</div></div>'+(reg.cambiosPantalla||0>0?'<div class="aviso-cambios-resultado">⚠️ Se registró que saliste de esta pantalla '+reg.cambiosPantalla+' '+(reg.cambiosPantalla===1?'vez':'veces')+'.</div>':'')+'<div class="stats-grid"><div class="stat-box"><div class="valor">'+reg.incorrectas+'</div><div class="etiqueta">Incorrectas</div></div><div class="stat-box"><div class="valor">'+reg.noIdentifico+'</div><div class="etiqueta">Sin identificar</div></div><div class="stat-box"><div class="valor">'+fmt(reg.tiempoSegundos||0)+'</div><div class="etiqueta">Tiempo</div></div></div><p class="centrado" style="color:var(--texto-tenue);font-size:0.75rem;margin-top:10px;">Registrado el '+fecha.toLocaleDateString('es-MX')+'</p></div><div class="tarjeta"><h2 class="subtitulo" style="text-align:left;">Temas a reforzar</h2><p class="recomendacion-texto">'+esc(recomendar(arr))+'</p>'+temasHtml+'</div><button class="btn btn-secundario btn-bloque" onclick="irA(\'consultar\')" style="margin-bottom:10px;">Volver</button><button class="btn btn-primario btn-bloque" onclick="volverInicio()">Inicio</button>';
}
function vistaPanel(){
  var regs=E.registros||[];var n=regs.length;var prom=n>0?regs.reduce(function(a,r){return a+(r.puntaje||0);},0)/n:0;var dom=n>0?Math.round((prom/(regs[0]?.total||TOT))*100):0;var tProm=n>0?regs.reduce(function(a,r){return a+(r.tiempoSegundos||0);},0)/n:0;
  var acierto=new Array(TOT).fill(0);var noId=new Array(TOT).fill(0);regs.forEach(function(r){var resp=r.respuestas||{};for(var bi=0;bi<TOT;bi++){if(resp[bi]===P[bi].c){acierto[bi]++;}if(resp[bi]==='no_identifico'){noId[bi]++;}}});
  var filasPreg=P.map(function(q,bi){var pa=n>0?Math.round((acierto[bi]/n)*100):0;var pn=n>0?Math.round((noId[bi]/n)*100):0;return '<tr><td>'+(bi+1)+'</td><td>'+esc(q.t)+'</td><td>'+pa+'%</td><td>'+pn+'%</td></tr>';}).join('');
  var filasAlumnos=regs.slice().sort(function(a,b){return new Date(b.fecha)-new Date(a.fecha);}).map(function(r){var fecha=new Date(r.fecha);var camb=r.cambiosPantalla||0;var hi=r.horaInicio?new Date(r.horaInicio).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'—';return '<tr><td>'+esc(r.nombre)+'</td><td>'+esc(r.carrera||'Procesos Productivos')+'</td><td>'+esc(r.grupo||'1° E')+'</td><td>'+r.puntaje+'/'+r.total+'</td><td>'+hi+'</td><td>'+fTiempo(r.tiempoSegundos||0)+'</td><td style="'+(camb>0?'color:var(--amarillo);font-weight:700;':'')+'">'+camb+'</td><td>'+fecha.toLocaleDateString('es-MX')+'</td></tr>';}).join('');
  var zona='';if(E.confirmandoBorrado){zona='<div class="mensaje-error">⚠️ ¿Confirmas?</div><div class="fila-botones"><button class="btn btn-secundario" onclick="cancelarBorrado()">Cancelar</button><button class="btn btn-peligro" onclick="confirmarBorrado()">Sí</button></div>';}else{zona='<button class="btn btn-peligro" onclick="pedirBorrado()">Borrar respuestas</button><button class="btn btn-peligro" onclick="limpiarAlmacenamientoLocal()" style="margin-top:10px;">🧹 Limpiar datos</button>';}
  return '<div class="tarjeta"><div class="logo">UTSC</div><h2 class="subtitulo">📊 Panel docente</h2><p class="institucion">Universidad Tecnológica Santa Catarina</p>'+(E.mensajeBorrado?'<div class="mensaje-'+E.mensajeBorrado.tipo+'">'+esc(E.mensajeBorrado.texto)+'</div>':'')+'<div class="stats-grid"><div class="stat-box"><div class="valor">'+n+'</div><div class="etiqueta">Respuestas</div></div><div class="stat-box"><div class="valor">'+prom.toFixed(1)+'/'+(regs[0]?.total||TOT)+'</div><div class="etiqueta">Promedio</div></div><div class="stat-box"><div class="valor">'+dom+'%</div><div class="etiqueta">Dominio</div></div><div class="stat-box"><div class="valor">'+fTiempo(Math.round(tProm))+'</div><div class="etiqueta">Tiempo promedio</div></div></div></div><div class="tarjeta"><h2 class="subtitulo" style="text-align:left;">Desempeño por pregunta</h2><div class="tabla-scroll"><table><thead><tr><th>#</th><th>Tema</th><th>% Acierto</th><th>% Sin identificar</th></tr></thead><tbody>'+(filasPreg||'<tr><td colspan="4">Sin datos</td></tr>')+'</tbody></table></div></div><div class="tarjeta"><h2 class="subtitulo" style="text-align:left;">Respuestas individuales</h2><div class="tabla-scroll"><table><thead><tr><th>Nombre</th><th>Carrera</th><th>Grupo</th><th>Puntaje</th><th>Hora inicio</th><th>Tiempo</th><th>Cambios</th><th>Fecha</th></tr></thead><tbody>'+(filasAlumnos||'<tr><td colspan="8">Sin respuestas</td></tr>')+'</tbody></table></div><button class="btn btn-secundario btn-bloque" onclick="exportarCSV()" style="margin-top:12px;">Exportar CSV</button>'+(E.puntoCorte?'<p style="margin-top:10px;font-size:0.7rem;color:var(--texto-tenue);text-align:center;">Mostrando desde '+new Date(E.puntoCorte).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})+'. <span class="enlace-tenue" onclick="alternarHistorico()">'+(E.mostrandoHistorico?'Ocultar histórico':'Ver histórico')+'</span></p>':'')+'<div class="zona-riesgo"><h3>⚠️ Zona de riesgo</h3><p>Usa esta opción para dejar el panel en cero antes del examen real.</p>'+zona+'</div></div><button class="btn btn-secundario btn-bloque" onclick="volverInicio()">Salir</button>';
}

document.addEventListener('fullscreenchange',function(){if(E._ignorarCambioPantalla){return;}var avisoSeleccion=document.querySelector('.aviso-seleccion');if(!document.fullscreenElement&&E.pantalla==='cuestionario'&&!avisoSeleccion){E.cambios++;mostrarAvisoCambioPantalla();}});

render();
